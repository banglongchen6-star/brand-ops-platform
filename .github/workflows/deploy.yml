name: Deploy to Alibaba Cloud

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            cd /root/brand-ops-platform
            git pull origin main
            npm run build
            sudo kill $(sudo lsof -t -i:3000) 2>/dev/null || true
            sleep 2
            pm2 delete brand-ops 2>/dev/null || true
            pm2 start npm --name brand-ops -- start
            pm2 save
            echo "✅ Deploy done"
